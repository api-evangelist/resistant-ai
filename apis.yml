name: Resistant AI
description: >-
  Resistant AI protects financial-services organizations from fraud and financial crime with AI.
  Its Documents product detects fake, tampered, forged, and AI-generated documents (PDFs and images)
  in seconds, and its Transactions product layers 80+ AI models over existing transaction-monitoring
  systems for AML and fraud detection. The Resistant Documents API provides programmatic document
  forensics — fraud, quality, classification, content extraction, and Adaptive Decision — through an
  OAuth2 create/upload/poll workflow across regional cells, with polling, Amazon SQS, and Svix webhook
  result delivery, plus a Tenant Management API for provisioning tenants and applications.
